<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2c37b8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Спецмазь">
<title>Кабинет Спецмазь</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<script>window.__bip=null;addEventListener("beforeinstallprompt",function(e){e.preventDefault();window.__bip=e;document.dispatchEvent(new Event("bip"))});</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@500;700;800&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: sticky header with tabs; promos with timers on top, then the debt card, fresh projects from the Disk, archive in its own view; the viewer is a full-screen cinema overlay with sliding transitions */
:root{
  --bg:#e7e9ee;--surface:#f5f6f8;--raised:#eceef2;--sunk:#dadde4;--line:#c9ced8;
  --ink:#151a23;--muted:#535c6c;--faint:#848c9b;
  --accent:#3b46c4;--accent-ink:#ffffff;--accent-soft:#dcdff3;--accent-text:#2e379f;
  --gold:#85590a;--gold-soft:#efe3c8;
  --ok:#1d7150;--ok-soft:#d3e9de;--bad:#b0372e;--bad-soft:#f1dcd9;
  --chip-ok:#16704c;--chip-bad:#a8332b;--chip-wait:#7d5605;
  --hero:#2c37b8;--hero-ink:#ffffff;--hero-muted:rgba(255,255,255,.74);--hero-line:rgba(255,255,255,.14);--hero-chip:rgba(255,255,255,.12);--hero-gold:#f6c25c;--hero-money:#8ff0b6;--money-chip:#168a52;
  --promo:#1e2430;--promo-ink:#f3f4f7;--promo-muted:rgba(243,244,247,.7);--promo-accent:#f6c25c;--promo-line:rgba(255,255,255,.14);
  --on-media:#ffffff;--scrim:rgba(6,8,12,.72);
  --v-bg:#07080b;--v-ink:#f2f4f8;--v-muted:#a2aab8;--v-chip:rgba(255,255,255,.1);
  --shadow:0 1px 2px rgba(16,20,27,.06),0 12px 32px rgba(16,20,27,.08);
  --f-display:"Geologica","Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --wrap:1160px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d0f14;--surface:#151821;--raised:#1a1e28;--sunk:#212633;--line:#2b3141;
  --ink:#edf0f6;--muted:#9aa3b3;--faint:#6d7688;
  --accent:#6f7cff;--accent-ink:#0b0e1d;--accent-soft:#1d2250;--accent-text:#aab2ff;
  --gold:#f2b84b;--gold-soft:#33280f;
  --ok:#45c48e;--ok-soft:#10291f;--bad:#ff7d72;--bad-soft:#3a1815;
  --hero:#2b36c4;--promo:#1b2130;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0f14;--surface:#151821;--raised:#1a1e28;--sunk:#212633;--line:#2b3141;
  --ink:#edf0f6;--muted:#9aa3b3;--faint:#6d7688;
  --accent:#6f7cff;--accent-ink:#0b0e1d;--accent-soft:#1d2250;--accent-text:#aab2ff;
  --gold:#f2b84b;--gold-soft:#33280f;
  --ok:#45c48e;--ok-soft:#10291f;--bad:#ff7d72;--bad-soft:#3a1815;
  --hero:#2b36c4;--promo:#1b2130;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.35);
  color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.015em;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(26px,4.4vw,36px);font-weight:800}
h2{font-size:clamp(18px,2.4vw,22px);font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{opacity:.55}50%{opacity:1}100%{opacity:.55}}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .9s linear infinite;flex-shrink:0}
svg{flex-shrink:0}

/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:saturate(1.3) blur(14px);backdrop-filter:saturate(1.3) blur(14px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:16px;min-height:62px;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0}
.logo{width:38px;height:38px;border-radius:11px;background:#fff;display:block;overflow:hidden;flex-shrink:0;box-shadow:0 0 0 1px var(--line)}
.logo img{width:100%;height:100%;display:block}
.brand b{display:block;font-family:var(--f-display);font-weight:800;font-size:14px;letter-spacing:.12em;line-height:1.15}
.brand small{display:block;color:var(--muted);font-size:12.5px;line-height:1.25}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav a{position:relative;padding:8px 12px;border-radius:10px;text-decoration:none;font-weight:600;font-size:14.5px;color:var(--muted);white-space:nowrap}
.nav a:hover{color:var(--ink);background:var(--sunk)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.nav .dot{position:absolute;top:7px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.top-r{display:flex;align-items:center;gap:8px;flex-shrink:0;margin-left:auto}
.sync{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px;white-space:nowrap}
.icon-btn{height:40px;min-width:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 10px;font-weight:600;font-size:14px;white-space:nowrap}
.icon-btn svg{width:18px;height:18px}
.viewas{height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 10px;font-weight:600;font-size:14px}
.linkbtn{border:0;background:none;padding:0;color:var(--accent-text);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.asbar{background:var(--gold-soft);color:var(--ink);font-size:13.5px}
.asbar .wrap{display:flex;gap:10px;align-items:center;justify-content:space-between;padding-block:7px;flex-wrap:wrap}
@media (max-width:560px){.top.adm .brand>span:last-child{display:none}}
@media (max-width:420px){.brand small{display:none}.icon-btn.inst{padding:0 9px;gap:5px;font-size:13.5px}}
@media (max-width:820px){
  .nav a{padding:7px 10px;font-size:14px}
  .top-in{flex-wrap:wrap;gap:6px 10px;padding-block:8px 6px}
  .nav{order:3;flex-basis:100%;margin-inline:-6px}
  .sync .txt,.icon-btn:not(.inst) .txt{display:none}
  .viewas{max-width:132px;padding:0 6px}
  .brand small{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}

/* page */
main{display:grid;gap:34px;padding-block:24px 150px}
.block{display:grid;gap:14px;min-width:0}
.block-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px 16px;flex-wrap:wrap}
.block-head>div{display:grid;gap:4px}
.block-head>.tools{display:flex;flex:1 1 420px;justify-content:flex-end}
.page-head{display:grid;gap:8px;max-width:72ch}
.eyebrow{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sub-h{font-family:var(--f-body);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:6px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:18px}
.notice{padding:14px 16px;border-radius:16px;background:var(--accent-soft);font-size:14.5px}
.notice.bad{background:var(--bad-soft)}
.morelinks{display:flex;gap:10px;flex-wrap:wrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 16px;font-weight:600;font-size:14.5px;line-height:1.2;text-decoration:none;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.btn svg{width:17px;height:17px}
.btn.light{background:var(--hero-ink);color:var(--hero)}
.btn.glass{background:var(--hero-chip);color:var(--hero-ink)}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.line{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)}
.btn.small{padding:7px 11px;font-size:13.5px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:default}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:500;white-space:nowrap;text-decoration:none}
.pill.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--sunk);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;flex:1 1 260px;min-width:0;max-width:420px}
.search svg{width:17px;height:17px;color:var(--muted)}
.search input{border:0;background:transparent;padding:10px 0;width:100%;outline:none;min-width:0}

/* promos: compact horizontal cards */
.strip-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.strip-nav{display:flex;gap:6px}
.strip-nav button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;color:var(--ink)}
.strip-nav svg{width:16px;height:16px}
@media (hover:none){.strip-nav{display:none}}
.promos{display:grid;grid-auto-flow:column;grid-auto-columns:min(86%,370px);gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;scrollbar-width:thin;overscroll-behavior-x:contain}
.promos>*{scroll-snap-align:start}
.promo{position:relative;display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;align-items:stretch;text-align:left;border:0;border-radius:18px;background:var(--promo);color:var(--promo-ink);padding:10px 14px 10px 10px;min-width:0;width:100%}
.promo.draft{outline:2px dashed var(--promo-accent);outline-offset:-2px}
.promo-img{position:relative;display:block;width:84px;height:104px;border-radius:12px;overflow:hidden;background:var(--promo-line);isolation:isolate}
.promo-img .cv{position:absolute;inset:0;z-index:-1}
.promo-img.icon{display:grid;place-items:center;color:var(--promo-accent)}
.promo-img.icon svg{width:30px;height:30px}
.promo-img .chip.play{left:5px;bottom:5px;padding:3px 4px}
.promo-body{display:grid;gap:5px;align-content:center;min-width:0}
.promo-top{display:flex;gap:8px;align-items:center;min-width:0}
.promo-badge{font-family:var(--f-display);font-weight:800;font-size:13.5px;background:var(--promo-accent);color:var(--promo);padding:2px 8px;border-radius:7px;white-space:nowrap}
.promo-kind{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--promo-muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.promo-title{font-family:var(--f-display);font-weight:700;font-size:15.5px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.timer{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;font-size:12.5px;color:var(--promo-muted)}
.timer b{font-family:var(--f-num);font-size:14px;color:var(--promo-ink);font-weight:700;letter-spacing:-.02em}
.tbar{height:4px;border-radius:99px;background:var(--promo-line);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--promo-accent);border-radius:99px}
.promo-sheet-media{position:relative;border-radius:16px;overflow:hidden;background:var(--v-bg);min-height:120px;display:grid;place-items:center}
.promo-sheet-media img,.promo-sheet-media video{display:block;width:100%;height:auto;max-height:48vh;object-fit:contain}
.promo-sheet-media .spin{margin:50px auto}
.promo-full{display:grid;gap:10px;background:var(--promo);color:var(--promo-ink);border-radius:16px;padding:16px}
.promo-full p{color:var(--promo-muted)}
.tcap{display:flex;justify-content:space-between;font-size:12.5px;color:var(--promo-muted);gap:8px}
.promo-full .tbar{height:6px}
.promo-full .timer{font-size:14px}
.promo-full .timer b{font-size:17px}

/* strips and categories */
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(148px,176px);gap:14px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity;scrollbar-width:thin;overscroll-behavior-x:contain}
.strip>*{scroll-snap-align:start}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:12px}
.cat{position:relative;display:block;border-radius:18px;overflow:hidden;isolation:isolate;aspect-ratio:5/4;text-decoration:none;color:var(--on-media);background:var(--sunk)}
.cat .cv{position:absolute;inset:0;z-index:-2}
.cat .cv img{transition:transform .6s ease}
.cat:hover .cv img{transform:scale(1.045)}
.cat::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent 25%,var(--scrim) 100%)}
.cat-in{position:absolute;inset:auto 0 0 0;padding:10px 12px 11px;display:grid;gap:1px}
.cat-in b{font-family:var(--f-display);font-size:16px;font-weight:700;line-height:1.15;text-wrap:balance}
.cat-in span{font-size:12.5px;opacity:.9}
@media (max-width:560px){.cats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.cat{aspect-ratio:16/11;border-radius:14px}.cat-in b{font-size:15px}}

/* hero */
.hero.rep .h-big{color:var(--hero-money)}
.hero{position:relative;overflow:hidden;isolation:isolate;border-radius:22px;background:var(--hero);color:var(--hero-ink);padding:clamp(14px,2.2vw,20px) clamp(16px,2.6vw,24px);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px 28px;align-items:center;box-shadow:var(--shadow)}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(118deg,var(--hero-line) 0 1px,transparent 1px 24px);-webkit-mask:linear-gradient(90deg,transparent 25%,#000 90%);mask:linear-gradient(90deg,transparent 25%,#000 90%)}
.h-label{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--hero-muted);font-weight:700}
.h-big{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,4.6vw,40px);line-height:1;letter-spacing:-.03em;margin-top:6px;white-space:nowrap}
.h-sub{margin-top:6px;color:var(--hero-muted);font-size:13.5px}
.h-sub b{color:var(--hero-ink);font-weight:700}
.h-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:10px}
.h-steps i{height:5px;border-radius:99px;background:var(--hero-line)}
.h-steps i.on{background:var(--hero-gold)}
.h-cap{margin-top:6px;font-size:12.5px;color:var(--hero-muted)}
.h-cap b{color:var(--hero-gold);font-weight:700}
.h-side{display:grid;gap:6px;align-content:start}
.h-stat{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 11px;border-radius:11px;background:var(--hero-chip)}
.h-stat span{color:var(--hero-muted);font-size:12.5px}
.h-stat b{font-family:var(--f-num);font-weight:700;font-size:13.5px;text-align:right;white-space:nowrap}
.h-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.h-actions .btn{padding:8px 13px;font-size:13.5px;border-radius:10px}
@media (max-width:760px){.hero{grid-template-columns:1fr}.h-side{grid-template-columns:1fr 1fr}.h-actions{grid-column:1 / -1}.h-stat{flex-direction:column;gap:1px}}

/* covers */
.cv{display:block;background:linear-gradient(135deg,var(--sunk),var(--raised))}
.cv:not(.has){animation:shimmer 2.4s ease-in-out infinite}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.cv.broken{animation:none}

/* sections */
.sections{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:16px}
.sec{position:relative;display:block;border-radius:20px;overflow:hidden;isolation:isolate;aspect-ratio:16/11;text-decoration:none;color:var(--on-media);background:var(--sunk)}
.sec .cv{position:absolute;inset:0;z-index:-2}
.sec .cv img{transition:transform .6s ease}
.sec:hover .cv img{transform:scale(1.045)}
.sec::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent 30%,var(--scrim) 100%)}
.sec-in{position:absolute;inset:auto 0 0 0;padding:14px 16px 15px;display:grid;gap:3px}
.sec-in b{font-family:var(--f-display);font-size:19px;font-weight:700;line-height:1.15;text-wrap:balance}
.sec-in .st{font-size:13px;opacity:.9}
@media (max-width:560px){.sections{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.sec{aspect-ratio:4/5;border-radius:16px}.sec-in{padding:10px 11px 11px}.sec-in b{font-size:15px}.sec-in .st{font-size:12px}}

/* tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:20px 14px}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 10px}}
.tw{position:relative;min-width:0}
.tw.is-hidden .tile{opacity:.42}
.eye{position:absolute;right:6px;top:6px;z-index:3;width:30px;height:30px;border:0;border-radius:50%;background:var(--scrim);color:var(--on-media);display:grid;place-items:center;padding:0}
.tw.adm .chips{right:42px}
.eye svg{width:16px;height:16px}
.tile{display:grid;gap:8px;align-content:start;text-align:left;background:none;border:0;padding:0;color:inherit;text-decoration:none;min-width:0;width:100%}
.thumb{position:relative;display:block;aspect-ratio:4/5;border-radius:15px;overflow:hidden;background:var(--sunk);isolation:isolate}
.thumb .cv{position:absolute;inset:0;z-index:-1}
.thumb .cv img{transition:transform .35s ease}
.tile:hover .thumb .cv img{transform:scale(1.035)}
.album .thumb{box-shadow:0 0 0 1px var(--line)}
.chip{position:absolute;display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:8px;font-size:11.5px;font-weight:700;line-height:1.2;letter-spacing:.01em}
.chip svg{width:11px;height:11px}
.chip.play{left:8px;bottom:8px;background:var(--scrim);color:var(--on-media)}
.chip.count{right:8px;bottom:8px;background:var(--scrim);color:var(--on-media)}
.chip.new{left:8px;top:8px;background:var(--accent);color:var(--accent-ink)}
.chip.unpaid{background:var(--chip-bad);color:var(--on-media)}
.chip.paid{background:var(--chip-ok);color:var(--on-media)}
.chip.wait{background:var(--chip-wait);color:var(--on-media)}
.chip.promo-c{background:var(--promo-accent);color:var(--promo)}
.chip.hid{background:var(--ink);color:var(--bg)}
.chips{position:absolute;top:8px;left:8px;right:8px;display:flex;flex-wrap:wrap;gap:4px;justify-content:space-between;pointer-events:none}
.chips .chip{position:static}
.chip.posted{right:8px;bottom:8px;background:var(--chip-ok);color:var(--on-media);padding:5px}
.t-name{font-weight:600;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.t-meta{font-size:12.5px;color:var(--muted);margin-top:-4px}
.skel .thumb{animation:shimmer 1.6s ease-in-out infinite}
.skel .t-name{height:12px;width:70%;border-radius:6px;background:var(--sunk)}
.month-h{font-family:var(--f-display);font-size:17px;font-weight:700;margin-top:10px;display:flex;gap:10px;align-items:baseline}
.month-h span{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:500}

/* folder */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:14px;color:var(--muted)}
.crumbs a{text-decoration:none;color:var(--muted)}
.crumbs a:hover{color:var(--ink)}
.crumbs span[aria-hidden]{opacity:.5}
.f-head{display:grid;gap:12px}
.f-bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.banner{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:16px;background:var(--bad-soft)}
.banner.ok{background:var(--ok-soft)}
.banner.promo-b{background:var(--gold-soft)}
.banner>div{display:grid;gap:2px;min-width:0}
.banner span{font-size:14px;color:var(--muted)}

/* payments */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:15px 17px;display:grid;gap:4px}
.stat span{font-size:13.5px;color:var(--muted)}
.stat b{font-family:var(--f-num);font-size:21px;font-weight:700;letter-spacing:-.02em}
.stat small{font-size:12.5px;color:var(--muted)}
.stat.gold b{color:var(--gold)}
.stat.money b{color:var(--ok)}
.chip.cutc{background:var(--money-chip);color:var(--on-media)}
.stat .txt{font-family:var(--f-display);font-size:19px}
.hint{background:var(--accent-soft);border-radius:14px;padding:12px 15px;font-size:14.5px;max-width:80ch}
.list{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.row{display:grid;grid-template-columns:auto 64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.sel{background:var(--accent-soft)}
.row.locked .r-main,.row.locked .r-right,.row.locked .r-thumb{opacity:.55}
.chk{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;color:var(--accent-ink)}
.chk svg{width:14px;height:14px}
.row.sel .chk{background:var(--accent);border-color:var(--accent)}
.chk.done{background:var(--chip-ok);border-color:var(--chip-ok);color:var(--on-media)}
.chk.blank{visibility:hidden}
.r-thumb{position:relative;display:block;width:64px;height:64px;border-radius:12px;overflow:hidden;background:var(--sunk);border:0;padding:0;isolation:isolate}
.r-thumb .cv{position:absolute;inset:0;z-index:-1}
.r-thumb .chip.play{left:4px;bottom:4px;padding:3px 4px}
.r-thumb.none{display:grid;place-items:center;color:var(--faint)}
.r-thumb.none svg{width:22px;height:22px}
.r-main{min-width:0;display:grid;gap:3px}
.r-name{font-weight:600;overflow-wrap:anywhere}
.r-sub{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.tag{font-size:11.5px;padding:2px 7px;border-radius:6px;background:var(--sunk);color:var(--muted);font-weight:700}
.tag.old{background:var(--gold-soft);color:var(--gold)}
.tag.disk{background:var(--accent-soft);color:var(--accent-text)}
.tag.when{background:var(--ok-soft);color:var(--ok)}
.r-right{text-align:right;display:grid;gap:2px;justify-items:end}
.price{font-family:var(--f-num);font-weight:700;white-space:nowrap}
.cut{font-family:var(--f-num);font-size:12.5px;color:var(--ok);white-space:nowrap;font-weight:700}
.lockmsg{font-size:12px;color:var(--muted)}
@media (max-width:560px){
  .row{grid-template-columns:auto 52px minmax(0,1fr);gap:10px 12px;padding:12px}
  .r-thumb{width:52px;height:52px}
  .r-right{grid-column:3;justify-items:start;text-align:left;display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
}
details.fold{display:grid;gap:12px}
details.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"Показать";margin-left:auto;font-size:13.5px;color:var(--accent-text);font-weight:600}
details.fold[open]>summary::after{content:"Скрыть"}
details.fold[open]>summary{margin-bottom:12px}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -10px 30px color-mix(in srgb,var(--ink) 10%,transparent);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.dock-in{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.dock-txt{display:grid;gap:2px;min-width:0}
.dock-txt small{color:var(--muted);font-size:12.5px}
.plus{color:var(--ok);font-family:var(--f-num);font-weight:700}
.dock.admin-bar{background:var(--gold-soft)}

/* forecast */
.chart{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;overflow-x:auto}
.chart svg{display:block;min-width:520px;width:100%;height:auto;margin:0 auto}
.chart .bar{fill:var(--accent)}
.chart .bar.done{fill:var(--chip-ok)}
.chart .axis{stroke:var(--line)}
.chart text{fill:var(--muted);font-family:var(--f-num);font-size:11px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:6px;align-content:start}
.card .big{font-family:var(--f-num);font-size:20px;font-weight:700}
.card .big small{font-family:var(--f-body);font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0}
.card p{color:var(--muted);font-size:14px}

/* awards */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.badge{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:6px;align-content:start}
.badge .ico{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--faint);font-family:var(--f-display);font-weight:800;font-size:15px}
.badge.got{border-color:var(--gold)}
.badge.got .ico{background:var(--gold);color:var(--surface)}
.badge small{color:var(--muted);font-size:13px}
.ladder{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.rung{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:12px 16px;border-top:1px solid var(--line);font-size:14.5px}
.rung:first-child{border-top:0}
.rung small{grid-column:1 / -1;color:var(--muted);font-size:13px}
.rung.cur{background:var(--gold-soft);font-weight:700}
.quest{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:grid;gap:6px}
.q-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.q-reward{font-size:13.5px;color:var(--gold);font-weight:600}

/* services */
.services{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.svc{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:grid;grid-template-rows:auto 1fr}
.svc-img{position:relative;display:block;aspect-ratio:16/9;background:var(--sunk);isolation:isolate}
.svc-img .cv{position:absolute;inset:0;z-index:-1}
.svc-img.empty{display:grid;place-items:center;color:var(--accent-text);background:var(--accent-soft)}
.svc-img.empty svg{width:40px;height:40px}
.svc-img .chip{left:10px;top:10px}
.svc-body{padding:16px;display:grid;gap:8px;align-content:start}
.svc-body p{color:var(--muted);font-size:14.5px}
.svc-price{font-family:var(--f-num);font-weight:700;font-size:15px}
.svc-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

/* prices */
.grades{list-style:none;margin:2px 0 0;padding:0;display:grid;border-top:1px solid var(--line)}
.grades li{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.grades li b{font-family:var(--f-num);font-weight:700;white-space:nowrap;letter-spacing:-.02em}
.g-edit{display:grid;gap:6px}
.g-row{display:grid;grid-template-columns:minmax(0,1fr) auto 104px 52px 34px;gap:6px;align-items:center}
.g-row input{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px 9px;min-width:0}
.g-row .g-from{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.g-row .g-from input{width:16px;height:16px;padding:0;accent-color:var(--accent)}
.g-row .g-e{text-align:center}
.g-del{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;color:var(--muted)}
.g-del svg{width:14px;height:14px}
.g-head{display:grid;grid-template-columns:minmax(0,1fr) auto 104px 52px 34px;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
@media (max-width:420px){.g-row,.g-head{grid-template-columns:minmax(0,1fr) auto 84px 44px 32px}}
.svc.edit .svc-body{gap:10px}
.total{font-family:var(--f-num);font-weight:700;font-size:17px}

/* reminder */
.remind{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:18px;background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent)}
.remind>div:first-child{display:grid;gap:2px;min-width:0}
.remind span{font-size:14px;color:var(--muted)}

/* drag to scroll */
.strip,.promos{-webkit-user-select:none;user-select:none}
.strip img,.promos img{-webkit-user-drag:none}
.dragging{scroll-snap-type:none!important;cursor:grabbing}
.dragging *{pointer-events:none}
.v-stage.mdrag{cursor:grabbing}

/* admin */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:12px}
.linkrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.linkrow code{font-family:var(--f-num);font-size:13px;background:var(--sunk);border-radius:10px;padding:10px 12px;overflow-x:auto;white-space:nowrap;display:block}
.rules{display:grid;gap:10px;margin:0;padding-left:20px}
.rules code{font-family:var(--f-num);font-size:13px;background:var(--sunk);border-radius:6px;padding:1px 6px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.prow small{color:var(--muted)}
.state{font-size:12px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.state.live{background:var(--ok-soft);color:var(--ok)}
.state.draft{background:var(--gold-soft);color:var(--gold)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--v-bg) 55%,transparent);display:grid;align-items:end;justify-items:center}
.sheet-in{background:var(--bg);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding-top:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:grid;gap:14px;align-content:start}
@media (min-width:820px){.sheet{align-items:center}.sheet-in{border-radius:22px;max-height:88vh}}
.sheet-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.field{display:grid;gap:6px;font-size:14px}
.field>span{color:var(--muted);font-weight:600;font-size:13px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px}
.field textarea{resize:vertical;line-height:1.5}
textarea.mono{font-family:var(--f-num);font-size:13px;min-height:220px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.opt input{width:20px;height:20px;margin-top:2px;flex-shrink:0;accent-color:var(--accent)}
.opt small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.tips{font-size:13.5px;color:var(--muted);display:grid;gap:6px}
.tipsbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
.tiplist{margin:0;padding-left:18px;display:grid;gap:8px;font-size:14px;color:var(--muted)}
.tiplist b{color:var(--ink)}
.tips b{color:var(--ink)}
.steps{display:grid;gap:8px;margin:0;padding-left:20px;font-size:14.5px}

/* viewer */
.viewer{position:fixed;inset:0;z-index:70;background:var(--v-bg);color:var(--v-ink);display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.v-top{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.v-ic{width:42px;height:42px;border-radius:50%;border:0;background:var(--v-chip);color:var(--v-ink);display:grid;place-items:center;padding:0}
.v-ic svg{width:20px;height:20px}
.v-count{font-family:var(--f-num);font-size:13px;color:var(--v-muted)}
.v-path{font-size:13.5px;color:var(--v-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.v-stage{position:relative;min-height:0;overflow:hidden;touch-action:pan-y}
.v-hold{position:absolute;top:0;bottom:0;left:72px;right:72px}
.v-slide{position:absolute;inset:0;will-change:transform}
.v-slide video,.v-slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;background:transparent}
.v-slide .spin{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-width:3px;border-color:var(--v-chip);border-top-color:var(--v-ink)}
.v-err{position:absolute;inset:0;color:var(--v-muted);text-align:center;display:grid;gap:10px;place-content:center;justify-items:center}
.v-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:0;background:var(--v-chip);color:var(--v-ink);display:grid;place-items:center;padding:0;z-index:2}
.v-nav svg{width:22px;height:22px}
.v-nav[disabled]{opacity:.25;cursor:default}
.v-nav.prev{left:10px}.v-nav.next{right:10px}
.v-cap{width:100%;max-width:1040px;margin:0 auto;padding-top:12px;padding-bottom:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:9px}
.v-title{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.2}
.v-meta{font-size:13px;color:var(--v-muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.v-pay{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:10px 12px;border-radius:12px;background:var(--v-chip);font-size:14px}
.v-pay .dotc{width:8px;height:8px;border-radius:50%;background:var(--chip-bad)}
.v-pay.ok .dotc{background:var(--chip-ok)}
.v-pay.pr .dotc{background:var(--promo-accent)}
.v-pay .sub{color:var(--v-muted)}
.v-actions{display:flex;flex-wrap:wrap;gap:8px}
.v-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:11px;border:0;background:var(--v-chip);color:var(--v-ink);font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap}
.v-btn svg{width:16px;height:16px}
.v-btn.on{background:var(--chip-ok)}
.v-btn.acc{background:var(--accent);color:var(--accent-ink);margin-left:auto}
@media (max-width:640px){.v-hold{left:0;right:0}.v-nav{display:none}.v-title{font-size:17px}}

/* toast & lock */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;z-index:90;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.lock{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.lock-card{max-width:420px;text-align:center;display:grid;gap:14px;justify-items:center}
.lock-card form{display:flex;gap:8px;width:100%;margin-top:6px}
.lock-card input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px;font-family:var(--f-num);font-size:17px;letter-spacing:.12em;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top" id="top"></header>
<div id="asbar"></div>
<main class="wrap" id="view" tabindex="-1"></main>
<div id="dock"></div>
<div id="viewer" class="viewer" hidden role="dialog" aria-modal="true" aria-label="Просмотр"></div>

async function deriveFromCode(code){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);

function parseTag(name){
  const m = String(name).match(/\[([^\]]*)\]/);
  if (!m) return null;
  const t = m[1];
  const paid = /(оплач|опл\b|✓|✅|paid)/i.test(t);
  let price = null;
  const k = t.match(/(\d+(?:[.,]\d+)?)\s*(?:к|k|тыс)/i);
  if (k) price = Math.round(parseFloat(k[1].replace(',', '.')) * 1000);
  else { const d = t.replace(/(\d)[\s. ](?=\d{3}(?!\d))/g, '$1').match(/\d{3,}/); if (d) price = +d[0]; }
  if (price == null && !paid) return null;
  return {price, paid};
}
function title(it){
  if (!it || it.p === '/') return 'Все папки';
  let s = it.n;
  if (it.t === 'file') s = s.replace(/\.[A-Za-z0-9]{2,5}$/, '');
  if (parseTag(s)) s = s.replace(/\[[^\]]*\]/, ' ');
  s = s.replace(/^[\s+]+/, '').replace(/_/g, ' ').replace(/(\d)\s?к\s?(\d)/g, '$1:$2').replace(/\s+/g, ' ').trim();
  return s || it.n;
}

const D = {dirs: new Map(), idx: new Map(), rid: new Map(), ver: 0, crawl: {running: false, done: 0, total: 0, err: 0, ts: 0, failed: false}};

async function getJSON(u){

async function apiList(path, full){
  const fields = ['name','type','path','created','size','mime_type','resource_id','preview'].concat(full ? ['file','sizes'] : []);
  const q = '&preview_size=560x&preview_crop=false&fields=_embedded.total,' + fields.map(f => '_embedded.items.' + f).join(',');
  let items = [], off = 0, total = 0;
  do {
    const j = await getJSON(API + '?public_key=' + encodeURIComponent(PK) + '&path=' + encodeURIComponent(path) + '&limit=500&offset=' + off + q);
    const it = (j._embedded && j._embedded.items) || [];
    total = j._embedded ? j._embedded.total : 0;
    items = items.concat(it); off += it.length;
    if (!it.length) break;

function dropPath(p){
  const it = D.idx.get(p); D.idx.delete(p);
  if (it && it.r && D.rid.get(it.r) === p) D.rid.delete(it.r);
  const d = D.dirs.get(p); if (d) { D.dirs.delete(p); for (const c of d.items) dropPath(c.p); }
}
function setDir(path, items, ts, full){
  const prev = D.dirs.get(path);
  if (prev) { const keep = new Set(items.map(i => i.p)); for (const o of prev.items) if (!keep.has(o.p)) dropPath(o.p); }
  const now = Date.now();
  for (const it of items) {
    const old = D.idx.get(it.p);
    if (old) {
      if (!it.f && old.f && now - old.fts < F_TTL) { it.f = old.f; it.fts = old.fts; }
      if (!it.big && old.big && now - old.ts < PV_TTL) it.big = old.big;
    }
    D.idx.set(it.p, it); if (it.r) D.rid.set(it.r, it.p);
  }
  D.dirs.set(path, {items, ts, full: !!full || !!(prev && prev.full && now - prev.ts < PV_TTL)});

}
function saveTree(){

  }
}
function loadTree(){
  const c = store.get(K_.tree, null);
  if (!c || c.v !== 3 || !Array.isArray(c.dirs)) return 0;
  for (const [p, ts, its] of c.dirs) {

    D.dirs.set(p, {items, ts, full: false});
    for (const it of items) { D.idx.set(it.p, it); if (it.r) D.rid.set(it.r, it.p); }

async function crawl(){
  const C = D.crawl;
  if (C.running) return;
  Object.assign(C, {running: true, done: 0, total: 1, err: 0, failed: false});
  updateSync();
  const seen = new Set();
  const queue = [{p: '/', c: Infinity}];
  let active = 0;
  await new Promise(resolve => {
    const push = items => { for (const it of items) if (it.t === 'dir' && !nameHidden(it)) { queue.push({p: it.p, c: it.c}); C.total++; } };
    const pump = () => {
      if (!queue.length && !active) return resolve();
      queue.sort((a, b) => b.c - a.c);
      while (active < 6 && queue.length) {
        const job = queue.shift(); active++;
        apiList(job.p).then(items => { seen.add(job.p); push(items); })
          .catch(() => { C.err++; const old = D.dirs.get(job.p); if (old) { seen.add(job.p); push(old.items); } })
          .finally(() => { active--; C.done++; liveSoon(); pump(); });
      }
    };
    pump();
  });
  C.running = false; C.ts = Date.now();
  if (!C.err) {
    for (const p of [...D.dirs.keys()]) if (!seen.has(p)) D.dirs.delete(p);
    D.idx.clear(); D.rid.clear();
    for (const [, d] of D.dirs) for (const it of d.items) { D.idx.set(it.p, it); if (it.r) D.rid.set(it.r, it.p); }
    D.ver++;
  }
  C.failed = C.done > 0 && C.err === C.done;
  if (!C.failed) saveTree();
  liveSoon(true);
}

/* stats (memo by tree version and visibility) */
let ST = {key: '', map: null};
function stats(){
  const key = D.ver + ':' + HVER + ':' + adminView() + ':' + R() + ':' + PAY.ver;
  if (ST.key === key) return ST.map;
  const map = new Map();
  const walk = p => {
    if (map.has(p)) return map.get(p);
    const s = {v: 0, i: 0, newest: 0, oldest: 0, size: 0, full: true, leaf: true};
    map.set(p, s);
    const d = D.dirs.get(p);
    if (!d) { s.full = false; return s; }
    for (const it of d.items) {
      if (!vis(it)) continue;
      if (it.t === 'dir') {
        s.leaf = false;
        const c = walk(it.p);
        s.v += c.v; s.i += c.i; s.size += c.size; if (!c.full) s.full = false;
        s.newest = Math.max(s.newest, c.newest || it.c);
        const co = c.oldest || it.c; s.oldest = s.oldest ? Math.min(s.oldest, co) : co;
      } else if (isMedia(it)) {
        if (isVideo(it)) s.v++; else s.i++;
        s.size += it.s; s.newest = Math.max(s.newest, it.c); s.oldest = s.oldest ? Math.min(s.oldest, it.c) : it.c;
      }
    }
    return s;
  };
  walk('/');
  for (const p of D.dirs.keys()) walk(p);
  ST = {key, map};
  return map;
}
function countLine(s, short){
  if (!s) return '';
  const n = s.v + s.i;
  if (!n) return s.full ? (short ? '0' : 'пока пусто') : '…';
  if (short) return String(n) + (s.full ? '' : '+');
  const parts = [];
  if (s.v) parts.push(s.v + ' видео');
  if (s.i) parts.push(s.i + ' ' + plural(s.i, 'картинка', 'картинки', 'картинок'));
  let line = parts.join(' · ') + (s.full ? '' : ' …');
  if (s.oldest && s.newest) { const a = new Date(s.oldest).getFullYear(), b = new Date(s.newest).getFullYear(); line += ' · ' + (a === b ? a : a + '-' + b); }
  return line;
}
/* projects: leaf folders with media + loose media files */
let UN = {key: '', list: []};
function units(){

  if (UN.key === key) return UN.list;

    else for (const f of kids) if (isMedia(f)) out.push({it: f, date: f.c});

function coverOf(p, depth){
  depth = depth || 0;
  const it = D.idx.get(p);
  if (it && it.t === 'file') return isMedia(it) && freshPv(it) ? it : null;
  const d = D.dirs.get(p);
  if (!d) return null;
  const v = d.items.filter(vis);
  const m = v.filter(isMedia).sort(byName).find(freshPv);
  if (m) return m;
  if (depth < 4) {
    const st = stats();
    const subs = v.filter(i => i.t === 'dir').sort((a, b) => ((st.get(b.p) || {}).newest || b.c) - ((st.get(a.p) || {}).newest || a.c));
    for (const s of subs) { const c = coverOf(s.p, depth + 1); if (c) return c; }
  }

}
const coverTried = new Set(), coverQ = [];
let coverActive = 0;
function wantCover(p){ if (coverTried.has(p)) return; coverTried.add(p); coverQ.push(p); runCovers(); }
function runCovers(){
  while (coverActive < 3 && coverQ.length) {
    const p = coverQ.shift(); coverActive++;
    findCover(p).catch(() => {}).finally(() => { coverActive--; liveSoon(); runCovers(); });
  }
}
async function findCover(p){
  const it = D.idx.get(p);
  if (it && it.t === 'file') { await apiList(parentOf(p)); return; }
  let cur = p;
  for (let depth = 0; depth < 4; depth++) {
    let d = D.dirs.get(cur);
    if (!d || !d.items.some(freshPv)) { await apiList(cur); d = D.dirs.get(cur); }
    const v = d.items.filter(vis);
    if (v.some(isMedia)) return;
    const subs = v.filter(i => i.t === 'dir').sort((a, b) => b.c - a.c);
    if (!subs.length) return;
    cur = subs[0].p;
  }
}

const PAY = {rows: [], byKey: new Map(), linkByPath: new Map(), queue: [], noPrice: [], paid: [], fresh: new Set(), sig: '', ver: 0, debt: 0, waiting: 0, eta: new Map()};
function ancestorTagged(p, linked){ let cur = parentOf(p); while (cur && cur !== '/') { if (linked.has(cur)) return true; const it = D.idx.get(cur); if (it && parseTag(it.n)) return true; cur = parentOf(cur); } return false; }
function buildPay(){
  const rows = CFG.rows.map(r => {
    const paths = (r.rids || []).map((x, i) => D.rid.get(x) || (r.paths || [])[i]).filter(Boolean);
    return {key: 'n' + r.n, n: r.n, type: r.type, name: r.name, price: r.price, status: r.status, note: r.note || '', paths, dyn: false, d: r.d ? Date.parse(r.d + 'T00:00:00Z') : 0};
  });
  for (const r of rows) for (const p of r.paths) { const it = D.idx.get(p); const tg = it && parseTag(it.n); if (tg) { if (tg.price != null) r.price = tg.price; if (tg.paid) r.status = 'paid'; } }
  const linked = new Set(rows.flatMap(r => r.paths));
  const dyn = [];
  for (const it of D.idx.values()) {
    if (linked.has(it.p) || nameHidden(it) || underNameHidden(it.p)) continue;
    if (it.t === 'file' && !isMedia(it)) continue;
    const tg = parseTag(it.n);
    if (!tg || ancestorTagged(it.p, linked)) continue;
    dyn.push({key: 'd' + (it.r || it.p), n: 0, type: title(node(parentOf(it.p))), name: title(it), price: tg.price, status: tg.paid ? 'paid' : 'unpaid', note: '', paths: [it.p], dyn: true, d: it.c});
  }
  dyn.sort((a, b) => a.d - b.d || collator.compare(a.name, b.name));
  let n = CFG.rows.reduce((m, r) => Math.max(m, r.n), 0);
  for (const d of dyn) d.n = ++n;
  const all = rows.concat(dyn);
  for (const r of all) { const ds = r.paths.map(p => (D.idx.get(p) || {}).c).filter(Boolean); if (ds.length) r.d = Math.min.apply(null, ds); if (!r.d) r.d = Date.now(); }
  const sig = all.map(r => r.key + ':' + r.price + ':' + r.status + ':' + r.paths.join('|') + ':' + r.d).join(';');
  const changed = sig !== PAY.sig;
  if (changed) PAY.ver++;
  PAY.sig = sig; PAY.rows = all;
  PAY.byKey = new Map(all.map(r => [r.key, r]));
  PAY.linkByPath = new Map(); for (const r of all) for (const p of r.paths) PAY.linkByPath.set(p, r);
  PAY.queue = all.filter(r => r.status !== 'paid' && r.price != null).sort((a, b) => a.d - b.d || a.n - b.n);
  PAY.noPrice = all.filter(r => r.status !== 'paid' && r.price == null);
  PAY.paid = all.filter(r => r.status === 'paid');
  const fc = Math.ceil(PAY.queue.length * FRESH_SHARE);
  PAY.fresh = new Set(PAY.queue.slice(PAY.queue.length - fc).map(r => r.key));
  PAY.debt = PAY.queue.reduce((s, r) => s + r.price, 0);
  PAY.waiting = PAY.debt * RATE;

/* expected payment month for every work, by the chosen pace, oldest first */
function etaMap(pace){
  const m = new Map(); let cum = 0; const now = Date.now();
  for (const r of PAY.queue) { cum += r.price; m.set(r.key, now + cum / pace * MONTH_MS); }
  return m;
}
const ageM = r => (Date.now() - r.d) / MONTH_MS;
function standing(){
  const oldest = PAY.queue.reduce((m, r) => Math.max(m, ageM(r)), 0);

  const next = i > 0 ? TIERS[i - 1] : null;
  const need = next ? PAY.queue.filter(r => ageM(r) > next.max) : [];
  return {i, tier: TIERS[i], next, need, needSum: need.reduce((s, r) => s + r.price, 0), oldest};
}
function rowOfPath(p){ let cur = p; while (cur && cur !== '/') { const r = PAY.linkByPath.get(cur); if (r) return r; cur = parentOf(cur); } return null; }
function rowsUnder(p){ const pre = p === '/' ? '/' : p + '/'; return PAY.rows.filter(r => r.paths.some(x => x.startsWith(pre))); }
const selRows = () => PAY.queue.filter(r => S.sel.includes(r.key));
function oldShare(rows){ let o = 0, f = 0; for (const r of rows) { if (PAY.fresh.has(r.key)) f += r.price; else o += r.price; } return (o + f) ? o / (o + f) : 1; }

  const r = PAY.byKey.get(key);
  if (!r || !PAY.queue.includes(r)) return;
  if (S.sel.includes(key)) {
    S.sel = S.sel.filter(k => k !== key);
    while (oldShare(selRows()) < OLD_MIN) {
      const last = selRows().filter(x => PAY.fresh.has(x.key)).pop();
      if (!last) break;
      S.sel = S.sel.filter(k => k !== last.key);
      toast('«' + last.name + '» убрана: старые работы должны быть не меньше ' + Math.round(OLD_MIN * 100) + '% суммы');
    }
  } else {
    if (!canAdd(r)) { toast('Сначала добавьте старые работы: они должны быть не меньше ' + Math.round(OLD_MIN * 100) + '% суммы'); return; }
    S.sel.push(key);

}

function catOf(u){
  const p = u.it.p;
  if (/\/Мультфильмы\//.test(p)) return 'mult';
  if (/карус|карсу/i.test(p)) return 'car';
  let vid;
  if (u.it.t === 'file') vid = isVideo(u.it); else { const s = stats().get(p) || {v: 0, i: 0}; vid = s.v >= s.i; }
  if (vid && /креатив|обложк/i.test(p)) return 'vcreo';
  if (!vid && !/\/Посты\//.test(p) && (/креатив|статик|статичн/i.test(p) || /\/\+[^/]*$/.test(p))) return 'static';
  if (!vid && /\/Посты\//.test(p)) return 'posts';

const MONTH_RE = ['январ','феврал','март','апрел','ма[йя]','июн','июл','август','сентябр','октябр','ноябр','декабр'].map(x => new RegExp('(^|[^а-яё])' + x, 'i'));
function unitMonth(u){
  const segs = u.it.p.split('/').filter(Boolean);
  let m = -1, y = 0;
  for (let k = segs.length - 1; k >= 0 && m < 0; k--) { const t = segs[k].replace(/\.[a-z0-9]{2,5}$/i, ''); for (let i = 0; i < 12; i++) if (MONTH_RE[i].test(t)) { m = i; const yy = t.match(/20\d\d/); if (yy) y = +yy[0]; break; } }
  if (!y) { const ym = u.it.p.match(/20\d\d/g); y = ym ? +ym[ym.length - 1] : 0; }
  const d = new Date(u.date);
  if (m < 0) return {y: d.getFullYear(), m: d.getMonth()};
  return {y: y || d.getFullYear(), m};
}

  if (!remindDays().includes(new Date().getDay()) || store.get(K_.remind, '') === new Date().toDateString()) return '';
  const notifyBtn = canNotify() && isStandalone() && Notification.permission === 'default' ? '<button class="btn ghost" data-act="notify-on">Присылать уведомлением</button>' : '';
  return '<section class="remind" role="status"><div><b>Сегодня день оплаты</b><span>К оплате ' + rub(PAY.debt) + (repLayer() ? ', ваши +' + rub(PAY.waiting) : '') + '. Список на оплату собирается за минуту.</span></div><div class="actions"><a class="btn" href="#/pay">Собрать оплату</a>' + notifyBtn + '<button class="btn ghost" data-act="remind-ok">Позже</button></div></section>';
}
async function saveRemindData(){
  if (!('caches' in window) || location.protocol !== 'https:' || !money() || isAdmin()) return;
  try {
    const c = await caches.open('sm-data');
    const old = await c.match('/__remind'); const prev = old ? await old.json() : {};
    await c.put('/__remind', new Response(JSON.stringify({days: remindDays(), text: remindText().replace(/^Сегодня день оплаты: к/, 'К'), last: prev.last || '', on: PAY.queue.length > 0}), {headers: {'content-type': 'application/json'}}));
  } catch (e) {}
}
async function enableNotify(){
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { toast('Уведомления не разрешены в браузере'); return; }
    const reg = await navigator.serviceWorker.ready;
    await saveRemindData();
    if (reg.periodicSync) await reg.periodicSync.register('pay-remind', {minInterval: 12 * 3600e3});
    store.set(K_.notify, 1);
    toast('Готово, напоминания будут приходить в ' + remindDays().map(d => DOW_FULL[d]).join(' и '));
    render(true);
  } catch (e) { toast('Не получилось включить уведомления'); }
}

/* ---------- install as an app ---------- */
let deferredPrompt = window.__bip || null;
document.addEventListener('bip', () => { deferredPrompt = window.__bip; });
let appInstalled = false;
if (navigator.getInstalledRelatedApps) navigator.getInstalledRelatedApps().then(a => { if (a && a.length) { appInstalled = true; render(true); } }).catch(() => {});
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const installable = () => location.protocol === 'https:' && !isStandalone() && !appInstalled;
window.addEventListener('appinstalled', () => { deferredPrompt = null; toast('Приложение установлено'); render(true); });
async function doInstall(){
  if (deferredPrompt) { const dp = deferredPrompt; deferredPrompt = null; window.__bip = null; try { await dp.prompt(); const c = await dp.userChoice; if (c && c.outcome === 'accepted') toast('Устанавливаю…'); } catch (e) {} return; }
  const android = /android/i.test(navigator.userAgent), edge = /edg\//i.test(navigator.userAgent);
  openSheet('Установить приложение', isIOS
    ? '<ol class="steps"><li>Нажмите кнопку «Поделиться» внизу Safari.</li><li>Выберите «На экран Домой».</li><li>Нажмите «Добавить».</li></ol><p class="muted small">Если при первом открытии с экрана Домой кабинет попросит код, введите код из вашей ссылки: это последние 7 символов адреса.</p>'
    : android ? '<ol class="steps"><li>Нажмите меню Chrome (три точки справа вверху).</li><li>Выберите «Установить приложение» или «Добавить на гл. экран».</li><li>Нажмите «Установить».</li></ol>'
    : '<ol class="steps"><li>Посмотрите в адресную строку справа: там значок монитора со стрелкой. Нажмите его и затем «Установить».</li><li>Если значка нет: меню ' + (edge ? 'Edge (три точки) → «Приложения» → «Установить этот сайт как приложение»' : 'Chrome (три точки) → «Трансляция, сохранение и отправка» → «Установить страницу как приложение»') + '.</li><li>Если и там нет пункта, кабинет уже установлен: найдите «Спецмазь» в меню Пуск.</li></ol>');
}
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('/sw.js').catch(() => {});
/* fresh version: check when the tab comes back and every 20 minutes, reload when the site was updated */
const BUILD = 'mvr4m9dw';
let verAsk = 0;
async function checkVersion(){
  if (location.protocol !== 'https:' || Date.now() - verAsk < 60e3) return;
  verAsk = Date.now();
  try {
    const j = await fetch('/version.json?t=' + Date.now(), {cache: 'no-store'}).then(r => r.ok ? r.json() : null);
    if (!j || !j.b || j.b === BUILD) return;
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration(); if (reg) reg.update().catch(() => {});
    const busy = V.open || document.querySelector('.sheet') || (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) || (isAdmin() && draftDirty());
    if (!busy) { location.reload(); return; }
    toast('Кабинет обновился. Обновите страницу, чтобы увидеть новую версию');
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkVersion(); });
window.addEventListener('pageshow', e => { if (e.persisted) checkVersion(); });
setInterval(checkVersion, 20 * 60e3);
setTimeout(checkVersion, 4000);

/* ---------- events ---------- */
async function download(p){
  try {
    toast('Готовлю файл…');
    const j = await getJSON(API + '/download?public_key=' + encodeURIComponent(PK) + '&path=' + encodeURIComponent(p));
    const a = document.createElement('a'); a.href = j.href; a.rel = 'noreferrer'; document.body.appendChild(a); a.click(); a.remove();
  } catch (e) { toast('Не получилось скачать, попробуйте ещё раз'); }
}
function toggleHidden(p){ editConf(c => { const s = new Set(c.hidden || []); if (s.has(p)) s.delete(p); else s.add(p); c.hidden = [...s]; }); toast(HSET.has(p) ? 'Скрыто с сайта. Осталось опубликовать' : 'Снова видно. Осталось опубликовать'); }
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.closest('.sheet')) return;
  const act = b.dataset.act;
  if (act === 'view') { const seq = SEQ[b.dataset.seq]; if (seq) openViewer(seq, +b.dataset.i); }
  else if (act === 'row-view') {
    const r = PAY.byKey.get(b.dataset.k); if (!r) return;
    const items = await rowMedia(r);
    if (items.length) openViewer(items, 0); else toast('Файлы этой работы не найдены на Диске');
  }
  else if (act === 'sel') { toggleSel(b.dataset.k); render(true); }
  else if (act === 'budget') { pickBudget(+b.dataset.v); render(true); }
  else if (act === 'clear') { S.sel = []; S.budget = null; saveUI(); render(true); }
  else if (act === 'report') openReport();
  else if (act === 'pace') { S.pace = +b.dataset.v; saveUI(); render(true); }
  else if (act === 'kind') { S.kind = b.dataset.v; lastWorksSig = ''; render(true); }
  else if (act === 'sort') { S.sort = b.dataset.v; saveUI(); render(true); }
  else if (act === 'year') { S.year = +b.dataset.v; render(true); }
  else if (act === 'brand') { S.brand = b.dataset.v; render(true); }
  else if (act === 'strip') { const el = $('#' + b.dataset.t); if (el) el.scrollBy({left: +b.dataset.d * el.clientWidth * 0.8, behavior: reduced ? 'auto' : 'smooth'}); }
  else if (act === 'promo-open') { const p = (conf().promos || []).find(x => x.id === b.dataset.id); if (p) openPromo(p); }
  else if (act === 'opts') openOptions();
  else if (act === 'install') doInstall();
  else if (act === 'recrawl') crawl();
  else if (act === 'zip') download(b.dataset.p);
  else if (act === 'order') openOrder(b.dataset.id);
  else if (act === 'order-promo') { const p = (conf().promos || []).find(x => x.id === b.dataset.id); if (p) { if (V.open) closeViewer(); openOrder(p.service, p); } }
  else if (act === 'adays') { adminDays = +b.dataset.v; render(true); }
  else if (act === 'fdays') { editConf(c => { c.freshDays = +b.dataset.v; }); render(true); }
  else if (act === 'hide') { e.preventDefault(); e.stopPropagation(); toggleHidden(b.dataset.p); render(true); }
  else if (act === 'g-add') { const sid = b.closest('.svc.edit').dataset.sid; editSvc(sid, sv => { sv.g = (sv.g || []).concat([{t: '', p: 0, e: '', f: false}]); }); render(true); }
  else if (act === 'g-del') { const sid = b.closest('.svc.edit').dataset.sid, gi = +b.closest('.g-row').dataset.gi; editSvc(sid, sv => { sv.g.splice(gi, 1); }); render(true); }
  else if (act === 'svc-del') { const sid = b.closest('.svc.edit').dataset.sid; editSvc(null, list => { const i = list.findIndex(x => x.id === sid); if (i > -1) list.splice(i, 1); }); render(true); toast('Услуга удалена. Осталось опубликовать'); }
  else if (act === 'svc-move') { const sid = b.closest('.svc.edit').dataset.sid, d = +b.dataset.d; editSvc(null, list => { const i = list.findIndex(x => x.id === sid), j = i + d; if (i > -1 && j >= 0 && j < list.length) { const t = list[i]; list[i] = list[j]; list[j] = t; } }); render(true); }
  else if (act === 'svc-add') { editSvc(null, list => { list.unshift({id: 's' + Date.now().toString(36), t: 'Новая услуга', d: '', p: '', g: [{t: '', p: 0, e: '', f: false}]}); }); render(true); }
  else if (act === 'remind-ok') { store.set(K_.remind, new Date().toDateString()); render(true); }
  else if (act === 'notify-on') enableNotify();
  else if (act === 'promo-new') promoForm(null);
  else if (act === 'promo-edit') promoForm((conf().promos || []).find(x => x.id === b.dataset.id));
  else if (act === 'publish') publish();
  else if (act === 'draft-drop') { DRAFT = null; store.del(K_.draft); refreshHidden(); render(true); toast('Изменения отменены'); }
  else if (act === 'gh-setup') ghSetup();
  else if (act === 'viewas-me') { S.viewAs = 'admin'; saveUI(); refreshHidden(); render(); }
  else if (act === 'copy-ta') { const ta = $('#' + b.dataset.t); if (ta) copyText(ta.value, ta); }
  else if (act === 'copy-link') copyText(linkFor(b.dataset.r));
  else if (act === 'show-copy') { const rows = b.dataset.ns.split('.').map(n => PAY.rows.find(r => String(r.n) === n)).filter(r => r && r.price != null && r.status !== 'paid'); copyText(reportText(rows, {parts: 1, explain: true, link: false})); }
  else if (act === 'v-close') closeViewer();
  else if (act === 'v-prev') step(-1);
  else if (act === 'v-next') step(1);
  else if (act === 'v-retry') showItem(0, 0);
  else if (act === 'v-dl') download(V.seq[V.i].p);
  else if (act === 'v-link') { const p = V.seq[V.i].p; const c = (lockedItem(D.idx.get(p) || V.seq[V.i]) ? code('client') : code('editor')) || code('client'); const url = c ? ORIGIN + '/' + c + '#v=' + pathId(p) : ORIGIN + '/'; if (navigator.share && matchMedia('(hover: none)').matches) navigator.share({title: tileTitle(D.idx.get(p) || V.seq[V.i]), url}).catch(() => {}); else copyText(url); }
  else if (act === 'v-posted') {
    V.dirty = true;
    const p = V.seq[V.i].p;
    if (S.posted.has(p)) S.posted.delete(p); else S.posted.add(p);
    store.set(K_.posted, [...S.posted]);
    const on = S.posted.has(p); b.classList.toggle('on', on); b.querySelector('span').textContent = on ? 'Передано' : 'Отметить: передано';
  }
  else if (act === 'v-sel') {
    toggleSel(b.dataset.k); V.dirty = true;
    const r = PAY.byKey.get(b.dataset.k); const sel = S.sel.includes(b.dataset.k);
    b.innerHTML = sel ? 'В списке ' + ICON.check : 'В список на оплату';
    if (r && sel) toast('«' + r.name + '» в списке на оплату');
  }
  else if (act === 'v-folder') { e.preventDefault(); const p = parentOf(V.seq[V.i].p); V.pushed = false; closeViewer(true); history.replaceState(null, '', fHref(p)); onNav(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'viewas') { S.viewAs = e.target.value; saveUI(); refreshHidden(); lastWorksSig = ''; render(); window.scrollTo(0, 0); }
  const card = e.target.closest && e.target.closest('.svc.edit');
  if (card && adminView()) {
    const sid = card.dataset.sid, t = e.target;
    if (t.dataset.sf) { const v = t.value.trim(); editSvc(sid, sv => { sv[t.dataset.sf] = v; }); if (t.dataset.sf === 'p') render(true); else setDock(); }
    else if (t.dataset.gf) {
      const gi = +t.closest('.g-row').dataset.gi, f = t.dataset.gf;
      const v = f === 'f' ? t.checked : f === 'p' ? (+String(t.value).replace(/\D/g, '') || 0) : t.value.trim();
      editSvc(sid, sv => { sv.g = sv.g || []; if (sv.g[gi]) sv.g[gi][f] = v; });
      setDock();
    }
  }
  if (e.target.dataset && e.target.dataset.rd != null) { const d = +e.target.dataset.rd, on = e.target.checked; editConf(c => { const cur = new Set(Array.isArray(c.remind) ? c.remind : (CFG.remind || [1, 4])); if (on) cur.add(d); else cur.delete(d); c.remind = [...cur].sort(); }); setDock(); }
});
document.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  S.q = e.target.value;
  const w = $('#works'); if (w) { w.innerHTML = worksHTML(); fillLive(w); }
});
document.addEventListener('keydown', e => {
  if (!V.open) return;
  if (e.key === 'Escape') closeViewer();
  else if (e.key === 'ArrowRight') step(1);
  else if (e.key === 'ArrowLeft') step(-1);
});
function onNav(){
  const r = parseRoute(location.hash);
  if (r.v === 'viewer') { if (!V.open) openDeep(r.p); return; }
  if (V.open) closeViewer(true);
  const same = routeKey(S.route) === routeKey(r);
  S.route = r;
  if (same) { if (V.dirty) { V.dirty = false; render(true); } else $('#top').innerHTML = headerHTML(); return; }
  V.dirty = false;
  if (r.v === 'cat') S.brand = 'all';
  render();
  window.scrollTo(0, 0);
}
async function openDeep(p){
  const parent = parentOf(p);
  if (!D.dirs.get(parent) || !D.idx.get(p)) { try { await apiList(parent, true); } catch (e) {} }
  const d = D.dirs.get(parent);
  const files = d ? d.items.filter(i => vis(i) && isMedia(i)).sort(byName) : [];
  const i = files.findIndex(f => f.p === p);
  if (i < 0) { history.replaceState(null, '', fHref(parent)); S.route = {v: 'folder', p: parent}; render(); toast('Файл не найден, возможно его переименовали'); return; }
  history.replaceState(null, '', fHref(parent));
  S.route = {v: 'folder', p: parent};
  render();
  openViewer(files, i);
}
let pendingId = pendingVid;
function tryPendingVid(){
  if (!pendingId) return;
  for (const it of D.idx.values()) if (it.t === 'file' && pathId(it.p) === pendingId) { pendingId = ''; openDeep(it.p); return; }
  if (!D.crawl.running && D.crawl.ts) { pendingId = ''; toast('Файл не найден, возможно его переименовали'); }
}
window.addEventListener('popstate', onNav);
window.addEventListener('hashchange', onNav);

/* ---------- start ---------- */
const cachedAt = loadTree();
buildPay();
S.route = parseRoute(location.hash);
if (S.route.v === 'viewer') { const p = S.route.p; S.route = {v: 'folder', p: parentOf(p)}; render(); openDeep(p); }
else render();
if (pendingId) toast('Открываю файл…');
loadConf().then(ch => { if (ch) render(true); });
tryPendingVid();
if (!cachedAt || Date.now() - cachedAt > CRAWL_TTL) crawl(); else { D.crawl.ts = cachedAt; updateSync(); }
})();
</script>
